name: PHP lint

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  lint:
    name: php -l (all plugin files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Lint all PHP files
        run: |
          find . -name '*.php' -print0 | xargs -0 -n1 php -l
